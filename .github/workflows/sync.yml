name: Run DWD Pipeline

on:
  workflow_dispatch:
    inputs:
      dwd_run:
        description: 'Der vom Worker erkannte DWD-Lauf'
        required: true
        type: string  # Definiert den Typ explizit als String

concurrency:
  group: dwd-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code (main)
        uses: actions/checkout@v4

      - name: Checkout Existing Data (gh-pages-dev)
        uses: actions/checkout@v4
        with:
          ref: gh-pages-dev
          path: output
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          DWD_TARGET_RUN: ${{ github.event.inputs.dwd_run }}
        run: python pipeline/src/dwd_pipeline.py

      # ==========================================
      # NEU: Upload des 'output' Ordners zu Cloudflare Pages
      # ==========================================
      - name: Deploy Data to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          accountId: c728452fcd5090f3d7f2bacc5e75fcd2
          projectName: 'winddata'      # Nutze hier den Namen deines Cloudflare-Projekts
          directory: './output'        # Lädt exakt den generierten Datenordner hoch
          branch: 'main'               # Zwingt Cloudflare dazu, dies als Production-Build zu behandeln
          # Cloudflare erlaubt es, CORS-Header direkt hier zu definieren:
          headers: |
            /*
              Access-Control-Allow-Origin: *
              Access-Control-Allow-Headers: Content-Type, Authorization
      # ==========================================

      - name: Clean and Force-Push Data Branch (gh-pages-dev)
        run: |
          cd output
          rm -rf .git
          git init -b gh-pages-dev
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "DWD Weather Pipeline - Live State [skip ci]"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages-dev
