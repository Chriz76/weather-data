name: Run DWD Pipeline

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '45 * * * *'  # Hourly execution

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code (main)
        uses: actions/checkout@v4

      - name: Checkout Existing Data (gh-pages-dev)
        uses: actions/checkout@v4
        with:
          ref: gh-pages-dev
          path: output
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        run: python pipeline/src/dwd_pipeline.py

      - name: Inject Netlify Headers
        run: |
          echo "/*" > output/_headers
          echo "  Access-Control-Allow-Origin: *" >> output/_headers
          echo "  Access-Control-Allow-Headers: Content-Type, Authorization" >> output/_headers

      # ==========================================
      # NEU: Upload des 'output' Ordners zu Netlify
      # ==========================================
      - name: Deploy Data to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './output' # Lädt exakt den generierten Datenordner hoch
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-commit-comment: false # Deaktiviert den Fehler aus dem vorherigen Schritt
          deploy-message: "DWD Pipeline Update - Run #${{ github.run_number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 37db7a10-7183-47f1-bc9d-77d05228438f # Nutze hier die ID deiner Daten-Site auf Netlify
      # ==========================================

      - name: Clean and Force-Push Data Branch (gh-pages-dev)
        run: |
          cd output
          rm -rf .git
          git init -b gh-pages-dev
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "DWD Weather Pipeline - Live State [skip ci]"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages-dev
