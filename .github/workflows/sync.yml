name: Run DWD Pipeline

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Der vom Worker erkannte Lauf'
        required: true
        type: string
  #schedule:
  #  - cron: '45 * * * *'  # Hourly execution

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code (main)
        uses: actions/checkout@v4
        # Retrieve the application source code from the main branch

      - name: Checkout Existing Data (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: output
          fetch-depth: 1
        continue-on-error: true
        # Fetch the current state of data assets into the './output' directory.
        # 'continue-on-error' ensures the workflow proceeds if the 'gh-pages' branch does not exist yet.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Enable caching for optimized dependency installation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          TARGET_RUN: ${{ github.event.inputs.run }}
        run: python pipeline/src/pipeline.py
        # The script evaluates existing data in './output' to perform gap-detection
        # and incrementally updates the dataset along with index.json.

      - name: Force-Push Data Branch (gh-pages)
        run: |
          cd output
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Erstellt einen frischen Branch ohne History (falls er neu ist) 
          # oder hält die Datei-Nachverfolgung sauber aufrecht
          git checkout --orphan temp-branch || true
          
          git add -A
          git commit -m "DWD Weather Pipeline - Live State [skip ci]"
          
          # Drückt den Commit als einzigen Commit auf gh-pages
          git push --force origin HEAD:gh-pages
