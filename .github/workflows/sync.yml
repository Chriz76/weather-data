name: Run DWD Pipeline

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Der vom Worker erkannte Lauf'
        required: true
        type: string
  #schedule:
  #  - cron: '45 * * * *'  # Hourly execution

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code (main)
        uses: actions/checkout@v4
        # Retrieve the application source code from the main branch

      - name: Checkout Existing Data (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: output
        continue-on-error: true
        # Fetch the current state of data assets into the './output' directory.
        # 'continue-on-error' ensures the workflow proceeds if the 'gh-pages' branch does not exist yet.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Enable caching for optimized dependency installation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          TARGET_RUN: ${{ github.event.inputs.run }}
        run: python pipeline/src/pipeline.py
        # The script evaluates existing data in './output' to perform gap-detection
        # and incrementally updates the dataset along with index.json.

      - name: Clean and Force-Push Data Branch (gh-pages)
        run: |
          # Navigate into the processed output directory
          cd output
          
          # Remove the existing git metadata fetched during the checkout step
          rm -rf .git
          
          # Initialize a clean, isolated git repository for data deployment
          git init -b gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage and commit all existing and newly generated data assets
          git add -A
          git commit -m "DWD Weather Pipeline - Live State [skip ci]"
          
          # Force-push to overwrite the 'gh-pages' branch, keeping the commit history flat 
          # and serving the assets directly from the repository root for GitHub Pages.
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
